<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cowl · offline</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #ccc; font: 14px/1.5 system-ui, sans-serif; }
      form { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 12px 16px; }
      input[type=number] { width: 70px; }
      #status { padding: 0 16px; color: #8f8; min-height: 1.5em; }
      #stage { position: relative; height: calc(100% - 110px); margin: 0 16px; }
      #stage > * { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    </style>
  </head>
  <body>
    <form id="form">
      <input type="file" id="file" accept="video/*" />
      <label>fps <input type="number" id="fps" step="any" value="30" /></label>
      <label><input type="checkbox" id="json" checked /> JSON</label>
      <label><input type="checkbox" id="raw" checked /> cowl raw</label>
      <label><input type="checkbox" id="smooth" checked /> cowl smooth</label>
      <label><input type="checkbox" id="points" /> points</label>
      <button type="submit">Run</button>
    </form>
    <div id="status">Pick a clip (H.264). It's stepped frame by frame; saves go to captures/&lt;clip&gt;/.</div>
    <div id="stage">
      <video id="clip" muted playsinline></video>
      <canvas id="overlay"></canvas>
      <canvas id="three"></canvas>
    </div>
    <script type="module" src="/src/offline.js"></script>
  </body>
</html>
